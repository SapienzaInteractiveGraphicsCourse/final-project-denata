<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
    }
    #prompt,
    #blocker {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
    }
    #blocker {
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="info">
    SPACE: make the ship arrive / depart<br />
    T: dispatch / call the truck<br />
    W / S: raise / lower the crane boom<br />
    A / D: rotate the crane upper body<br />
    UP / DOWN: move the crane<br />
    R / F: raise / lower the spreader<br />
    E: pick up / place a container<br />
    C: load the container onto the truck<br />
    Q: drop the container
  </div>
  <div id="prompt" hidden></div>
  <div id="blocker" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
