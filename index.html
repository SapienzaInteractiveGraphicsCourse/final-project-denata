<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
    }
    #prompt,
    #blocker,
    #flashlightPrompt {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
    }
    #blocker {
      z-index: 2;
    }
    #lookControls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    #dayNightSwitch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
      font-size: 13px;
      user-select: none;
    }
    #dayNightSwitch .label {
      color: #333;
      min-width: 36px;
    }
    #dayNightSwitch .label.is-night {
      text-align: right;
    }
    #dayNightToggle {
      appearance: none;
      width: 42px;
      height: 22px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 11px;
      background: #87ceeb;
      cursor: pointer;
      position: relative;
    }
    #dayNightToggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
      transition: transform 0.15s ease;
    }
    #dayNightToggle:checked {
      background: #1a2a4a;
    }
    #dayNightToggle:checked::after {
      transform: translateX(20px);
    }
    #sunriseSwitch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,.85);
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      user-select: none;
      cursor: pointer;
    }
    #sunriseSwitch[hidden] {
      display: none;
    }
    #sunriseToggle {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
    }
    #cameraViews {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #cameraViews button {
      padding: 6px 10px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,.85);
      color: #333;
      cursor: pointer;
    }
    #cameraViews button.is-active {
      background: #2c4a6e;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="info">
    SPACE: make the ship arrive / depart<br />
    T: dispatch / call the truck<br />
    W / S: raise / lower the crane boom<br />
    A / D: rotate the crane upper body<br />
    UP / DOWN: move the crane<br />
    R / F: raise / lower the spreader<br />
    E: pick up / place a container<br />
    C: load the container onto the truck<br />
    Q: drop the container<br />
  </div>
  <div id="cameraViews">
    <button type="button" data-view="overview">1: Overview</button>
    <button type="button" data-view="crane">2: Crane</button>
    <button type="button" data-view="cabin">3: Cabin</button>
    <button type="button" data-view="ship">4: Ship</button>
    <button type="button" data-view="truck">5: Truck</button>
    <button type="button" data-view="worker">6: Worker</button>
    <button type="button" data-view="workerFp">7: Worker FP</button>
  </div>
  <div id="lookControls">
    <label id="dayNightSwitch">
      <span class="label">Day</span>
      <input type="checkbox" id="dayNightToggle" />
      <span class="label is-night">Night</span>
    </label>
    <label id="sunriseSwitch">
      <input type="checkbox" id="sunriseToggle" />
      Sunrise
    </label>
  </div>
  <div id="prompt" hidden></div>
  <div id="flashlightPrompt" hidden></div>
  <div id="blocker" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
